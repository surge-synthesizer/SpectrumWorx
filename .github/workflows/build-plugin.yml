# SpectrumWorx CI.
#
# Four things happen here, and they are separate jobs because they fail for
# separate reasons and a red square should say which:
#
#   gates              the two checks that need no compiler -- formatting and
#                      the Boost allowlist. Under a minute, and first to tell
#                      you.
#   test               ctest, on three platforms, in **both** Debug and Release
#                      -- except Windows, which runs Release only, and the
#                      matrix says why. Neither configuration alone runs the
#                      whole suite: the goldens SKIP under !NDEBUG, so Release
#                      is the only one that renders DSP, and Debug is the only
#                      one that runs the ~1200 asserts. Built with
#                      SW_BUILD_PLUGIN_BUNDLES=OFF, which leaves out the
#                      per-format wrapping and with it the VST3 and AudioUnit
#                      SDK fetches -- the test binaries link sw-dsp and sw-impl
#                      and want none of it (verified: that configuration writes
#                      no _deps/ at all). One leg is a compiler rather than a
#                      configuration, and so costs a matrix entry rather than a
#                      job: Linux Debug again under GCC 15.
#   build_plugin       the four bundles, and on anything but a pull request the
#                      installer as well.
#   build_plugin_msvc  a pull request only, and a compile check only. It builds
#                      the Windows bundles with MSVC, runs nothing and uploads
#                      nothing.
#
# A pull request builds and tests but makes no installer: what a PR has to
# answer is whether the code compiles and the suite passes on all three
# platforms, and packaging it answers nothing that merging will not.
#
# Windows ships clang-cl, and has since 10.08.2026. The front end that builds
# the download is now the one macOS and Linux already use, so the Windows binary
# is read by the same compiler as the other two rather than by the one nothing
# else in the project sees.
#
#   MSVC keeps a job, and only on a pull request: the tree still has to compile
# with it, because it is what anyone who opens this in Visual Studio gets, and
# learning that it does not from a bug report is worse than learning it from a
# PR. It tests nothing -- the suite runs under the shipping compiler now, which
# is where a test result is worth having.
#
#   Both Windows jobs use Visual Studio's own clang-cl, under VC/Tools/Llvm:
# `-TClangCL` selects it in build_plugin, and the "Locate Visual Studio's
# clang-cl" step below finds it for the Ninja test leg. The runner image also
# carries a standalone LLVM, on PATH and older; that step's note says why naming
# `clang-cl` bare is the wrong answer.
#
# Every leg of `test` is Ninja. Windows joined them on 10.08.2026, and bought
# much less by it than the argument for doing it said it would.
#
#   The argument: `cmake --build --parallel N` reaches MSBuild as /m:N, which is
# parallelism across *projects*, and nothing in this tree sets /MP to get it
# within one -- so sw-juce, one project holding the ten translation units that
# are all of JUCE, compiled them strictly serially. All true, and most of the way
# to irrelevant. The MSVC test leg -- since retired, along with MSVC's testing --
# went from 579 s to 549 s: 5 %, and that is the honest number because it is the
# leg where only the generator and the job count moved. MSBuild was evidently
# getting enough parallelism across the dozen-odd other projects to hide most of
# it.
#
#   The clang leg fell 545 s to 315 s over the same change and is **not** evidence
# for the generator: leaving the Visual Studio generator also changed which
# clang-cl gets picked, so a compiler version moved at the same time. The note on
# "Locate Visual Studio's clang-cl" below has that story.
#
#   `build_plugin` stays MSBuild on Windows, and 5 % is the reason. It is the job
# that produces the installer people download, and that is not enough to buy a
# generator change underneath it -- less so now that it is also the job that
# changed compilers. It did take the --parallel 4, which is a flag and not a
# generator: MSBuild gets /m:4 and still parallelises across projects only.
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build Plugin

on:
  push:
    branches:
      - main
      - rel_*
      - test/*
    tags:
      - 'v**'
  pull_request:
  # A run that was never created cannot be re-run, so an outage that swallows
  # a merge leaves no way back to it. This is that way.
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

defaults:
  run:
    shell: bash

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        # No submodules: both gates read our own sources only, and cloning
        # JUCE to check whitespace would be most of this job's runtime.

      # Its own Python, rather than the runner's. Ubuntu's system interpreter is
      # marked externally-managed (PEP 668) and refuses `pip install` outright,
      # which would fail this job for a reason that has nothing to do with the
      # tree.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # By version, not whatever the runner ships. clang-format's defaults move
      # between releases, so a newer major re-lays-out files nobody touched and
      # the gate fails on somebody else's afternoon. .clang-format names 21.1.5
      # and scripts/check_format.sh refuses to run against anything else.
      - name: Install clang-format 21.1.5
        run: pip install clang-format==21.1.5

      - name: Formatting
        run: scripts/check_format.sh

      - name: Boost allowlist
        run: scripts/check_boost_allowlist.sh

  test:
    name: Test - ${{ matrix.name }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform's failure is not a reason to stop learning what the other
      # two would have said.
      fail-fast: false
      # Written out rather than a config x os product with an exclude taking one
      # back: these five are not a grid -- Windows runs one configuration and
      # Linux runs three -- and a product would also merge any new leg into the
      # combination it collides with instead of adding it, which is how the GCC
      # 15 entry below would have quietly replaced the GCC 12 one.
      matrix:
        include:
          # clang-cl, which is the compiler the Windows download is built with,
          # and the only one Windows is tested under. It ran alongside an MSVC leg
          # for as long as it took to answer whether it could ship: the whole
          # suite, agreeing with MSVC on all of it, 386 of 386, under two
          # different clang-cls (22.1.3 and, for one run before the step below
          # pinned it back, 20.1.8). No golden could see a difference, so the MSVC
          # leg had nothing left to say and MSVC stopped being tested.
          #
          #   Release only. The Windows Debug job hangs rather than fails -- it
          # runs to the step timeout instead of reporting anything -- and the
          # standing guess is that a checked build of this suite wants more time
          # or more memory than that runner has. The guess is untested: nothing
          # here has reproduced it, and what was removed is a red square nobody
          # could read, not a diagnosis. It is a property of the runner and not of
          # a compiler; it outlived the MSVC leg it was first seen on. Release is
          # also the configuration that renders the goldens anyway.
          #
          #   It is the ~1200 asserts that go with it, and only on Windows: macOS
          # and Linux still run both configurations, so the checked build is still
          # exercised on every push -- but a Windows-only assertion failure has
          # nowhere to fire. Worth putting back the day the hang is understood.
          #                                   (06.08.2026.) (SW port)
          #
          # \note $SW_CLANG_CL rather than `clang-cl`, and it is a shell variable
          # rather than a matrix one: this string is pasted into the Configure
          # step's script, so bash expands it there. The "Locate Visual Studio's
          # clang-cl" step below sets it, and says why PATH is the wrong answer.
          - name: windows-x64
            os: windows-latest
            config: Release
            cmake_args: -GNinja -DCMAKE_C_COMPILER="$SW_CLANG_CL" -DCMAKE_CXX_COMPILER="$SW_CLANG_CL"
            use_gcc15: false

          # Host architecture only. The bundles are universal; the tests are not
          # shipped and building them twice buys nothing.
          - name: macos
            os: macos-latest
            config: Debug
            cmake_args: -GNinja
            use_gcc15: false
          - name: macos
            os: macos-latest
            config: Release
            cmake_args: -GNinja
            use_gcc15: false

          - name: linux-x64
            os: ubuntu-latest
            config: Debug
            cmake_args: -GNinja
            use_gcc15: false
          - name: linux-x64
            os: ubuntu-latest
            config: Release
            cmake_args: -GNinja
            use_gcc15: false

          # The Linux -Werror default was turned on because GCC 15.2 built the
          # tree clean -- 849 warnings over the Apple Clang baseline, five
          # causes, all worth the edit (cmake/sw-our-sources.cmake says which).
          # Nothing in CI held it to that afterwards: prepare-for-juce selects
          # GCC 12 and every other Linux leg takes it.
          #
          #   Debug only. What a second compiler has to say it says at compile
          # time, and rendering the goldens a second time would say nothing new.
          - name: linux-x64-gcc15
            os: ubuntu-latest
            config: Debug
            cmake_args: -GNinja -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
            use_gcc15: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare for JUCE
        uses: surge-synthesizer/sst-githubactions/prepare-for-juce@main
        with:
          os: ${{ runner.os }}

      # What -Ax64 used to do, and the price of leaving the Visual Studio
      # generator: a toolset is something MSBuild resolves and Ninja has no
      # concept of, so cl.exe, clang-cl.exe and the x64 headers and libs have to
      # be in the environment before cmake runs rather than named on its command
      # line. This exports vcvarsall's environment to GITHUB_ENV, so the
      # Configure, build and test steps below all inherit it.
      #
      # \note No install-ninja. windows-2025-vs2026 ships Ninja 1.13.2 on PATH --
      # the same version sst-githubactions/install-ninja defaults to -- and macOS
      # and Linux have relied on their images the same way for as long as they
      # have passed -GNinja; prepare-for-juce above installs it on none of the
      # three.
      #
      # \note `arch` and nothing else, and `vsversion` in particular. The action
      # has not been touched since April 2024, which is before VS 2026 and so
      # before the image this runs on -- but given no version it asks
      # `vswhere -latest`, which does not care, and only falls back to a
      # hard-coded list of years when vswhere is missing. The image has VSWhere
      # 3.1.7. Naming a version here would pin the search to `<major>.0,<major>.9`
      # and find nothing.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Which clang-cl, and it is not the one on PATH. Visual Studio ships an
      # LLVM of its own under VC/Tools/Llvm, and `-TClangCL` selected that; the
      # image separately installs a standalone LLVM whose bin directory *is* on
      # PATH, and vcvarsall does not add VS's. So `-DCMAKE_CXX_COMPILER=clang-cl`
      # silently picked a different and older compiler the first time this ran:
      # 20.1.8 against the 22.1.3 the MSBuild leg had been using.
      #
      #   Which is the wrong one to test, and more so now that clang-cl ships:
      # build_plugin below builds the Windows bundles with -TClangCL, so testing
      # the standalone LLVM would leave the suite green on a compiler nobody
      # downloads. This keeps the two the same compiler; the day build_plugin
      # moves to Ninja it needs this step too.
      #
      # \note vswhere bare, and -latest -prerelease to match how the action above
      # chose its instance -- asking a second question a different way is how the
      # two end up on different installs. Backslashes to forward slashes because
      # CMake takes a path and bash takes a backslash for an escape.
      - name: Locate Visual Studio's clang-cl
        if: runner.os == 'Windows'
        run: |
          vs=$(vswhere -latest -prerelease -products '*' -property installationPath)
          clang="${vs//\\//}/VC/Tools/Llvm/x64/bin/clang-cl.exe"
          if [ ! -x "$clang" ]; then
            echo "No clang-cl under the Visual Studio at '$vs'." >&2
            exit 1
          fi
          "$clang" --version
          echo "SW_CLANG_CL=$clang" >> "$GITHUB_ENV"

      # The runner image usually has it. "Usually" is not a thing to find out
      # from a red square six jobs into a matrix.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      # Whether the image already has it depends on which Ubuntu ubuntu-latest
      # points at this month, so ask the archive first and fall back to the
      # toolchain PPA, which carries GCC 15 for the releases whose archive does
      # not. The version is printed because "gcc15" in a job name is a claim and
      # this is the line in the log that settles it.
      - name: Install GCC 15
        if: matrix.use_gcc15
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y gcc-15 g++-15; then
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y gcc-15 g++-15
          fi
          g++-15 --version

      # SW_BUILD_TOOLS stays ON, and it is not optional: 66 of the 299 tests are
      # sw-show-ui rendering a page or a module UI offscreen, which is the only
      # thing that notices GUI code that compiles and then throws. Turning the
      # tools off to save a link would quietly run 233 and report success.
      - name: Configure
        run: |
          cmake -S . -B ./build ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DSW_BUILD_PLUGIN_BUNDLES=OFF \
            -DSW_WERROR=ON \
            -DGITHUB_ACTIONS_BUILD=TRUE

      # \note --config, and -C on the two ctest steps below, are inert now that
      # every leg is Ninja: a single-config generator takes its configuration
      # from CMAKE_BUILD_TYPE at configure time and both flags are accepted and
      # ignored. They are left in place rather than deleted because Windows was
      # the multi-config leg until this change, and a leg that goes back to the
      # Visual Studio generator needs them again -- silently building Debug and
      # calling it Release is what their absence would buy.
      #
      # \note --parallel 4, moved from 3 in the same commit as the generator --
      # so the 579 s to 549 s at the top of this file is the pair of them, not
      # the generator alone.
      #
      #   Four because that is what the runners have: ubuntu-latest and
      # windows-latest are 4 vCPU, macOS is 3 (M1). macOS is therefore one over
      # on purpose, and it cost nothing: its Release build went 323 s to 302 s
      # across the same change.
      - name: Build the test binaries
        run: |
          cmake --build ./build --config ${{ matrix.config }} \
            --target sw-dsp-tests sw-plugin-tests sw-show-ui --parallel 4

      # sw-plugin-tests instantiates the real editor, and JUCE wants a display
      # server to do that even for a component that is never shown. macOS and
      # Windows have one; a Linux runner does not, so it gets a virtual one.
      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir ./build -C ${{ matrix.config }} --output-on-failure

      - name: Test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir ./build -C ${{ matrix.config }} --output-on-failure

  build_plugin:
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows download, and clang-cl builds it: -TClangCL is Visual
          # Studio's own LLVM, the same compiler the test job runs the suite
          # under, so what ships here is what was tested there.
          #
          # Quiet, for now. The warning baseline is empty under MSVC -- and
          # clang-cl is MSVC as far as CMake's `if (MSVC)` is concerned -- so
          # -Werror buys nothing on this leg yet. It is where a Windows baseline
          # would first be tried; see issue #8 and the note at the top of
          # cmake/sw-our-sources.cmake.
          - os: windows-latest
            name: windows-x64
            cmake_args: -Ax64 -TClangCL
            target: spectrumworx-installer
            upload: true

          - os: macos-latest
            name: macos
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -GNinja
            target: spectrumworx-installer
            upload: true

          # Builds the installer and keeps it: Linux ships from the docker job
          # below, which builds against an older glibc than this runner has.
          - os: ubuntu-latest
            name: linux-x64
            cmake_args: -GNinja
            target: spectrumworx-installer
            upload: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare for JUCE
        uses: surge-synthesizer/sst-githubactions/prepare-for-juce@main
        with:
          os: ${{ runner.os }}

      # A no-op off Windows. sst-cmake looks for iscc on PATH at configure
      # time, so this has to happen before cmake runs or there is no .exe.
      - name: Install Inno Setup
        uses: surge-synthesizer/sst-githubactions/install-innosetup@main
        with:
          version: "6.7.1"

      # Pull requests come from forks as well as branches, and a fork cannot
      # read the signing secrets. They also do not build an installer, so there
      # is nothing here for them to sign.
      - uses: apple-actions/import-codesign-certs@v3
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS_P12 }}
          p12-password: ${{ secrets.CERT_PWD }}

      - name: Build pull request version
        if: github.event_name == 'pull_request'
        run: |
          cmake -S . -B ./build ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSW_BUILD_TESTS=OFF \
            -DSW_BUILD_TOOLS=OFF \
            -DSW_WERROR=ON \
            -DGITHUB_ACTIONS_BUILD=TRUE
          cmake --build ./build --config Debug \
            --target spectrumworx_clapfirst_all --parallel 4

      - name: Build release version
        if: github.event_name != 'pull_request'
        run: |
          export MAC_SIGNING_CERT="${{ secrets.MAC_SIGNING_CERT_NAME }}"
          export MAC_INSTALLING_CERT="${{ secrets.MAC_INSTALLING_CERT_NAME }}"

          export MAC_SIGNING_ID="${{ secrets.MAC_SIGNING_ID }}"
          export MAC_SIGNING_1UPW="${{ secrets.MAC_SIGNING_1UPW }}"
          export MAC_SIGNING_TEAM="${{ secrets.MAC_SIGNING_TEAM }}"

          cmake -S . -B ./build ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSW_BUILD_TESTS=OFF \
            -DSW_BUILD_TOOLS=OFF \
            -DSW_WERROR=ON \
            -DGITHUB_ACTIONS_BUILD=TRUE
          cmake --build ./build --config Release \
            --target ${{ matrix.target }} --parallel 4

      - name: Show Installer Directory
        if: github.event_name != 'pull_request' && matrix.target == 'spectrumworx-installer'
        run: ls -l build/installer

      - name: Upload artifact
        if: github.event_name != 'pull_request' && matrix.upload
        uses: actions/upload-artifact@v4
        with:
          path: build/installer
          name: dawplugin-${{ matrix.name }}

  # Everything that is left of MSVC, which is the question "does it still
  # compile". Not a matrix entry on build_plugin above, because what makes it
  # different from that job's legs is *when it runs*, and a matrix cannot say
  # that: a job-level `if` can, and a leg that produced nothing on every push
  # would be a green square standing for a checkout and no compiler.
  #
  #   No Inno Setup step and no signing certificates: it builds the bundles and
  # stops. basic_installer_clapfirst.cmake guards the installer target on
  # `if (TARGET n::compiler)`, so a configure without iscc on PATH is quiet
  # rather than fatal.
  #
  # \note Debug, matching what build_plugin's pull request legs use. The point is
  # the front end reading the headers, and MSVC objects to the same code either
  # way; Debug is the cheaper of the two to link.
  build_plugin_msvc:
    name: Build - windows-x64-msvc
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Prepare for JUCE
        uses: surge-synthesizer/sst-githubactions/prepare-for-juce@main
        with:
          os: ${{ runner.os }}

      - name: Build pull request version
        run: |
          cmake -S . -B ./build -Ax64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSW_BUILD_TESTS=OFF \
            -DSW_BUILD_TOOLS=OFF \
            -DSW_WERROR=ON \
            -DGITHUB_ACTIONS_BUILD=TRUE
          cmake --build ./build --config Debug \
            --target spectrumworx_clapfirst_all --parallel 4

  build_plugin_docker:
    name: Build - Docker Ubuntu 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The point of the old image is its glibc: a binary linked against
      # Ubuntu 20's runs on the distributions people actually have, and one
      # linked against the runner's does not.
      - name: Build in Docker
        uses: surge-synthesizer/sst-githubactions/cmake-in-docker@main
        with:
          image: ghcr.io/surge-synthesizer/sst-dockerimages/ubuntu20_gcc11:main
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          cmakeArgs: -DCMAKE_BUILD_TYPE=Release -GNinja -DSW_BUILD_TESTS=OFF -DSW_BUILD_TOOLS=OFF -DSW_WERROR=ON -DGITHUB_ACTIONS_BUILD=TRUE
          # No installer off a pull request, the same as every other leg.
          target: ${{ github.event_name == 'pull_request' && 'spectrumworx_clapfirst_all' || 'spectrumworx-installer' }}

      - name: Show Installer Directory
        if: github.event_name != 'pull_request'
        run: ls -l ./build/installer

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          path: build/installer
          name: build-docker-linux

  publish-plugin-nightly:
    name: Publish Nightly
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'surge-synthesizer' }}
    runs-on: ubuntu-latest
    needs: [gates, test, build_plugin, build_plugin_docker]

    # Read in the `if` of the Discord step below, which the secrets context
    # cannot be: a repository without the webhook configured -- a fork, or this
    # one before the secret is added -- posts nothing rather than going red
    # after a nightly it successfully published.
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_SPECTRUMWORX_WEBHOOK }}

    steps:
      # create_tag is false: the Nightly tag is made by hand, once, and every
      # run after that replaces its assets.
      - name: Upload to Nightly
        uses: surge-synthesizer/sst-githubactions/upload-to-release@main
        with:
          tag: Nightly
          reuse_tag: true
          create_tag: false
          token: ${{ secrets.GITHUB_TOKEN }}
          release_blurb_file: assets/installer/NightlyBlurb.md

      # After the upload, not before: the message links the tag, so it goes out
      # once there is something behind the link.
      - name: Post to Discord
        if: env.DISCORD_WEBHOOK != ''
        uses: surge-synthesizer/sst-githubactions/discord-release-notify@main
        with:
          webhook: ${{ secrets.DISCORD_SPECTRUMWORX_WEBHOOK }}
          tag: Nightly
          title: "A New SpectrumWorx Nightly is Available"
          subtitle: "Still a pre-release port -- bounce to stems for anything you want to keep."

  publish-plugin-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'surge-synthesizer'
    runs-on: ubuntu-latest
    needs: [gates, test, build_plugin, build_plugin_docker]

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_SPECTRUMWORX_WEBHOOK }}

    steps:
      - name: Upload to Release
        uses: surge-synthesizer/sst-githubactions/upload-to-release@main
        with:
          tag: ${{ github.ref_name }}
          reuse_tag: false
          create_tag: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK != ''
        uses: surge-synthesizer/sst-githubactions/discord-release-notify@main
        with:
          webhook: ${{ secrets.DISCORD_SPECTRUMWORX_WEBHOOK }}
          tag: ${{ github.ref_name }}
          title: "A New SpectrumWorx Release is Available"
          subtitle: "Release ${{ github.ref_name }}"
